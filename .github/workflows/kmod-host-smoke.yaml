name: kmod-host-smoke

# Checks whether agnocast.ko can be insmod'ed and cleanly rmmod'ed directly on
# a GitHub-hosted runner. If it can, requires_kernel_module / e2e tests can run
# on the runner itself without a VM (#1328).

on:
  pull_request:
    paths:
      - 'agnocast_kmod/**'
      - '.github/workflows/kmod-host-smoke.yaml'
  workflow_dispatch:

concurrency:
  group: kmod-host-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kmod-host-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          set -euo pipefail
          # Nothing here installs from Chrome's repo, and its broken index makes apt-get update exit 100.
          grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential "linux-headers-$(uname -r)" mokutil

      - name: Show module loading restrictions
        run: |
          echo "Kernel: $(uname -r)"
          echo "Cmdline: $(cat /proc/cmdline)"
          echo "Lockdown: $(cat /sys/kernel/security/lockdown 2>/dev/null || echo 'unavailable')"
          echo "modules_disabled: $(cat /proc/sys/kernel/modules_disabled)"
          echo "sig_enforce: $(cat /sys/module/module/parameters/sig_enforce 2>/dev/null || echo 'unavailable')"
          echo "Secure Boot: $(mokutil --sb-state 2>&1 || true)"

      - name: Build kmod
        run: |
          set -euo pipefail
          cd agnocast_kmod
          make

      - name: insmod
        run: |
          set -euo pipefail
          sudo dmesg -C
          if ! sudo insmod agnocast_kmod/agnocast.ko; then
            sudo dmesg
            echo "::error::insmod failed on ${{ matrix.os }}"
            exit 1
          fi
          grep -q '^agnocast ' /proc/modules
          test -c /dev/agnocast
          ls -l /dev/agnocast

      - name: rmmod refcount test
        run: bash scripts/test/test_rmmod_refcount.bash

      - name: rmmod
        run: |
          set -euo pipefail
          sudo rmmod agnocast
          if grep -q '^agnocast ' /proc/modules; then
            echo "::error::agnocast is still loaded after rmmod"
            exit 1
          fi

      - name: Check dmesg for kernel warnings
        if: always()
        run: |
          kmsg="$(sudo dmesg)"
          echo "${kmsg}"
          if grep -qE 'BUG:|WARNING:|Oops|Call Trace:' <<<"${kmsg}"; then
            echo "::error::Kernel warnings while agnocast was loaded"
            exit 1
          fi
