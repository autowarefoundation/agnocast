name: kmod-integration-test

# Loads agnocast.ko on the hosted runner and runs the tests that need it:
# the requires_kernel_module ctest label and the 1to1 / 2to2 e2e sweeps (#1328).
# Hosted runners boot without Secure Boot or lockdown, so an unsigned module
# can be insmod'ed directly.
#
# Kept separate from build-and-test-agnocastlib-components-heaphook.yaml: that
# workflow builds with --merge-install, while the scripts under scripts/test/
# build with colcon's default isolated layout, and colcon refuses to mix the two
# in one install/ directory.

on:
  pull_request:
    types:
      - labeled
  push:
    branches:
      - main

env:
  RUST_TOOLCHAIN: "1.75.0"

jobs:
  check-changes:
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'run-build-test' }}
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.check_diff.outputs.relevant }}
    steps:
    - name: Set PR fetch depth
      run: echo "PR_FETCH_DEPTH=$(( ${{ github.event.pull_request.commits }} + 1 ))" >> "${GITHUB_ENV}"

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: ${{ env.PR_FETCH_DEPTH }}

    - name: Check for relevant changes
      id: check_diff
      run: |
        set -euo pipefail
        CHANGED_FILES="$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})"
        if echo "$CHANGED_FILES" | grep -qE '^(agnocast_kmod|agnocast_heaphook|src|scripts/test)/|^\.github/workflows/kmod-integration-test\.yaml$'; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
        else
          echo "relevant=false" >> "$GITHUB_OUTPUT"
        fi

  kmod-integration-test-matrix:
    name: ${{ matrix.ros_distro }} / ${{ matrix.suite.name }}
    needs: check-changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.check-changes.outputs.relevant == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
        # The e2e sweeps dominate the run time, so they are split across jobs.
        # Each job repeats the setup and build (~7 min), so keep the suites
        # roughly the same length rather than adding more shards.
        suite:
          - { slug: integration-2to2, name: "requires_kernel_module + 2to2" }
          - { slug: 1to1-1, name: "1to1 (1/3)", shard: "1/3" }
          - { slug: 1to1-2, name: "1to1 (2/3)", shard: "2/3" }
          - { slug: 1to1-3, name: "1to1 (3/3)", shard: "3/3" }
        include:
          - ros_distro: humble
            os: ubuntu-22.04
          - ros_distro: jazzy
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
      # Picked up by every CMake configure, including the ones inside scripts/test/.
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPRESS: "true"
      CCACHE_COMPRESSLEVEL: "6"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Downloaded .deb files are cached so that a slow Ubuntu mirror only delays
    # `apt-get update`. Like ccache, every job restores and only the
    # integration-2to2 job saves. The month in the key refreshes the cache as
    # packages get updated upstream.
    - name: Compute apt cache key
      id: apt_key
      run: echo "key=${{ runner.os }}-${{ matrix.os }}-kmod-apt-$(date -u +%Y-%m)-${{ hashFiles('**/package.xml', '.github/workflows/kmod-integration-test.yaml') }}" >> "$GITHUB_OUTPUT"

    - name: Restore apt archives
      id: restore_apt
      uses: actions/cache/restore@v4
      with:
        path: ~/apt-archives
        key: ${{ steps.apt_key.outputs.key }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.os }}-kmod-apt-

    # A config file rather than a command-line option, so that the apt-get calls
    # made by rosdep use the same directory. The _apt sandbox user cannot reach
    # $HOME, so downloads run as root (apt would fall back to that with a warning
    # per package anyway).
    - name: Configure apt archive directory
      run: |
        mkdir -p ~/apt-archives/partial
        printf 'Dir::Cache::Archives "%s";\nAPT::Sandbox::User "root";\n' "$HOME/apt-archives" | sudo tee /etc/apt/apt.conf.d/99ci-archives

    - name: Setup ROS 2 environment
      run: |
        # Nothing here installs from Chrome's repo, and its broken index makes apt-get update exit 100.
        grep -rl 'dl\.google\.com' /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f || true
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends software-properties-common curl libunwind-dev ccache "linux-headers-$(uname -r)"

        sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key -o /usr/share/keyrings/ros-archive-keyring.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
        sudo apt-get update
        # ros-base instead of desktop: desktop pulls ~500 MB of GUI dependencies from
        # the Ubuntu mirror, which is intermittently slow on hosted runners. Anything
        # else the workspace needs is installed by rosdep below.
        sudo apt-get install -y --no-install-recommends ros-${{ env.ROS_DISTRO }}-ros-base python3-colcon-common-extensions ros-${{ env.ROS_DISTRO }}-ament-cmake python3-colcon-mixin ros-${{ env.ROS_DISTRO }}-ament-package

    - name: Install dependencies
      run: |
        source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
        sudo apt-get install -y --no-install-recommends python3-rosdep
        sudo rosdep init
        rosdep update
        sudo apt-get update
        rosdep install -y --from-paths src --ignore-src --rosdistro $ROS_DISTRO --skip-keys glog

    # See build-and-test-agnocastlib-components-heaphook.yaml for why this is needed on Jazzy.
    - name: Setup ROS Python packages for system Python
      run: |
        ROS_PYTHON_PATH=$(python3 -c "import sys; print(f'/opt/ros/${{ env.ROS_DISTRO }}/lib/python{sys.version_info.major}.{sys.version_info.minor}/site-packages')")
        SYSTEM_PYTHON_PATH=$(python3 -c "import site; print(site.getsitepackages()[0])")
        sudo ln -sf "$ROS_PYTHON_PATH/ament_package" "$SYSTEM_PYTHON_PATH/ament_package"
        python3 -c "import ament_package; print('ament_package found at:', ament_package.__file__)"

    - name: Setup Rust environment
      run: |
        rustup set profile minimal
        rustup toolchain install ${{ env.RUST_TOOLCHAIN }} --no-self-update
        rustup default ${{ env.RUST_TOOLCHAIN }}

    - name: Build and load agnocast kmod
      run: |
        set -euo pipefail
        echo "Kernel: $(uname -r)"
        echo "Lockdown: $(cat /sys/kernel/security/lockdown 2>/dev/null || echo 'unavailable')"
        (cd agnocast_kmod && make)
        sudo dmesg -C
        sudo insmod agnocast_kmod/agnocast.ko
        test -c /dev/agnocast

    - name: rmmod refcount test
      run: bash scripts/test/test_rmmod_refcount.bash

    # Every suite builds the same objects, so all jobs restore the cache but only
    # the integration-2to2 job saves it (see "Save ccache" below).
    - name: Restore ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ matrix.ros_distro }}-kmod-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ matrix.ros_distro }}-kmod-ccache-

    - name: Configure ccache
      run: |
        mkdir -p ~/.ccache
        ccache --max-size=1G
        ccache --zero-stats

    - name: Build workspace
      run: |
        source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
        colcon build --packages-up-to agnocast_e2e_test --cmake-args -DBUILD_TESTING=ON
        ccache --show-stats

    # The e2e launch files preload libagnocast_heaphook.so by name, and the
    # requires_heaphook gtests preload it from agnocastlib's install prefix.
    - name: Build agnocast_heaphook
      id: build_heaphook
      run: |
        set -euo pipefail
        cargo build --release --manifest-path agnocast_heaphook/Cargo.toml
        cp agnocast_heaphook/target/release/libagnocast_heaphook.so install/agnocastlib/lib/

    # The test steps below run independently of each other's results, so one
    # failing suite does not hide failures in the others. They are skipped only
    # if the build itself failed.
    # Failed tests are retried once: test_integration_client_agnocastlib and
    # test_integration_generic_subscription_agnocastlib intermittently hang or
    # crash. Drop the retry once they are fixed.
    - name: Run requires_kernel_module tests
      if: ${{ !cancelled() && steps.build_heaphook.outcome == 'success' && matrix.suite.slug == 'integration-2to2' }}
      run: bash scripts/test/run_requires_kernel_module_tests.bash --retest-until-pass 1

    - name: Run e2e_test_1to1
      if: ${{ !cancelled() && steps.build_heaphook.outcome == 'success' && matrix.suite.shard }}
      run: bash scripts/test/e2e_test_1to1.bash --shard ${{ matrix.suite.shard }} --parallel 2 --continue

    - name: Run e2e_test_2to2
      if: ${{ !cancelled() && steps.build_heaphook.outcome == 'success' && matrix.suite.slug == 'integration-2to2' }}
      run: bash scripts/test/e2e_test_2to2.bash --continue

    # apt leaves a root-only lock file there, which would make the cache upload fail.
    - name: Prepare apt archives for caching
      if: ${{ !cancelled() && steps.build_heaphook.outcome == 'success' && matrix.suite.slug == 'integration-2to2' && steps.restore_apt.outputs.cache-hit != 'true' }}
      run: |
        sudo apt-get autoclean
        sudo rm -f ~/apt-archives/lock
        sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
        du -sh ~/apt-archives

    - name: Save apt archives
      if: ${{ !cancelled() && steps.build_heaphook.outcome == 'success' && matrix.suite.slug == 'integration-2to2' && steps.restore_apt.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: ~/apt-archives
        key: ${{ steps.apt_key.outputs.key }}

    # Saved after the tests so it also holds the Release build of
    # agnocast_e2e_test that the e2e scripts make.
    - name: Save ccache
      if: ${{ !cancelled() && steps.build_heaphook.outcome == 'success' && matrix.suite.slug == 'integration-2to2' }}
      uses: actions/cache/save@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-${{ matrix.ros_distro }}-kmod-ccache-${{ github.sha }}

    - name: Unload agnocast kmod
      if: always()
      run: |
        if ! grep -q '^agnocast ' /proc/modules; then
          echo "agnocast is not loaded"
          exit 0
        fi
        # Bridge processes from the e2e tests may take a moment to exit.
        for _ in $(seq 10); do
          sudo rmmod agnocast && exit 0
          sleep 1
        done
        sudo fuser -v /dev/agnocast || true
        echo "::error::Failed to rmmod agnocast"
        exit 1

    - name: Check dmesg for kernel warnings
      if: always()
      run: |
        kmsg="$(sudo dmesg)"
        echo "${kmsg}"
        if grep -qE 'BUG:|WARNING:|Oops|Call Trace:' <<<"${kmsg}"; then
          echo "::error::Kernel warnings while agnocast was loaded"
          exit 1
        fi

    - name: Upload test logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: kmod-integration-test-logs-${{ matrix.ros_distro }}-${{ matrix.suite.slug }}
        path: |
          log/
          ~/.ros/log/
          /tmp/e2e_1to1_logs/
        if-no-files-found: ignore

  # Summary job that provides a single status check for branch protection rules,
  # since matrix jobs report one status per combination.
  kmod-integration-test:
    if: ${{ always() && (github.event_name == 'push' || github.event.label.name == 'run-build-test') }}
    needs: [check-changes, kmod-integration-test-matrix]
    runs-on: ubuntu-24.04
    steps:
      - name: Check matrix job results
        run: |
          for result in "${{ needs.check-changes.result }}" "${{ needs.kmod-integration-test-matrix.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "One or more jobs failed: check-changes=${{ needs.check-changes.result }}, matrix=${{ needs.kmod-integration-test-matrix.result }}"
              exit 1
            fi
          done
          echo "All jobs passed or were skipped"
